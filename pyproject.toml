[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "habit-workspace"
version = "0.0.1"
description = "Offline, file-first personal planning desktop application"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
keywords = ["habit-tracking", "personal-planning", "local-first", "file-first", "desktop"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = ["PySide6>=6.10,<7", "ruamel.yaml>=0.18.6,<0.20"]

[project.urls]
Homepage = "https://github.com/walterneto0/habit-workspace"
Repository = "https://github.com/walterneto0/habit-workspace"
Documentation = "https://github.com/walterneto0/habit-workspace#readme"
Issues = "https://github.com/walterneto0/habit-workspace/issues"
Changelog = "https://github.com/walterneto0/habit-workspace/blob/main/CHANGELOG.md"
Security = "https://github.com/walterneto0/habit-workspace/security"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.gui-scripts]
habit-workspace = "habit_workspace.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"habit_workspace.presentation" = ["qml/*.qml", "qml/qmldir"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
